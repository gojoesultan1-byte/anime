<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مركز التحكم  - Gojo Esultan</title>
    <style>
        :root {
            --cosmic-bg: #030014;
            --portal-purple: #7928ca;
            --neon-blue: #00dfd8;
            --text-main: #f3f4f6;
        }
        body {
            background-color: var(--cosmic-bg);
            color: var(--text-main);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
        }
        .admin-container {
            max-width: 800px;
            margin: 40px auto;
            background: rgba(13, 10, 35, 0.85);
            border: 1px solid rgba(0, 223, 216, 0.4);
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }
        h2 {
            color: var(--neon-blue);
            margin-bottom: 20px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 10px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            color: #9ca3af;
        }
        input, textarea, select {
            width: 100%;
            padding: 12px;
            background: rgba(0,0,0,0.5);
            border: 1px solid rgba(121, 40, 202, 0.5);
            border-radius: 8px;
            color: #fff;
            box-sizing: border-box;
        }
        button {
            background: linear-gradient(135deg, var(--neon-blue), var(--portal-purple));
            color: #030014;
            border: none;
            padding: 12px 24px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.2s;
        }
        button:hover {
            transform: scale(1.02);
        }
        .back-link {
            display: inline-block;
            margin-bottom: 20px;
            color: var(--neon-blue);
            text-decoration: none;
        }
    </style>
</head>
<body>

    <div class="admin-container">
        <a href="index.html" class="back-link">← العودة للرئيسية الكونية</a>
        
        <!-- قسم تسجيل الدخول لو مش مسجل -->
        <div id="admin-auth-box">
            <h2>تسجيل دخول المسؤول الكوني</h2>
            <div class="form-group">
                <label>البريد الإلكتروني للإدارة:</label>
                <input type="email" id="admin-email" placeholder="gojoesultan1@gmail.com">
            </div>
            <div class="form-group">
                <label>كلمة المرور:</label>
                <input type="password" id="admin-pass" placeholder="كلمة المرور">
            </div>
            <button onclick="loginAdmin()">دخول البعد</button>
        </div>

        <!-- لوحة التحكم الفعلية بعد الدخول -->
        <div id="admin-dashboard-box" style="display:none;">
            <h2>نشر محتوى جديد (صور / فيديوهات الأيباد)</h2>
            <div class="form-group">
                <label>عنوان المنشور:</label>
                <input type="text" id="post-title" placeholder="أدخل العنوان...">
            </div>
            <div class="form-group">
                <label>وصف المنشور:</label>
                <textarea id="post-desc" placeholder="اكتب الوصف هنا..."></textarea>
            </div>
            <div class="form-group">
                <label>اختر القسم الكوني:</label>
                <select id="post-section">
                    <option value="صور ومنشورات الأنمي">صور ومنشورات الأنمي</option>
                    <option value="مشاهدة الأنمي">مشاهدة الأنمي</option>
                </select>
            </div>
            <div class="form-group">
                <label>اختر ملف الوسائط (صورة أو فيديو من الأيباد):</label>
                <input type="file" id="post-file-input" accept="image/*,video/*">
            </div>
            <button onclick="publishPost()">نشر في البعد فوراً 🚀</button>
        </div>
    </div>

    <script src="admin.js"></script>
</body>
</html>
