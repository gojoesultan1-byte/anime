<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gojo Esultan - البوابة الكونية الموازية</title>
    <style>
        :root {
            --cosmic-bg: #030014;
            --portal-purple: #7928ca;
            --neon-blue: #00dfd8;
            --star-glow: rgba(0, 223, 216, 0.5);
            --text-main: #f3f4f6;
        }

        body {
            background-color: var(--cosmic-bg);
            color: var(--text-main);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
            background-image: 
                radial-gradient(circle at 20% 30%, rgba(121, 40, 202, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 80% 70%, rgba(0, 223, 216, 0.1) 0%, transparent 40%);
            min-height: 100vh;
        }

        .cosmic-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 40px;
            background: rgba(10, 5, 30, 0.85);
            border-bottom: 1px solid rgba(0, 223, 216, 0.3);
            backdrop-filter: blur(10px);
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.8);
        }

        .portal-brand {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .portal-brand img {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border: 2px solid var(--neon-blue);
            box-shadow: 0 0 15px var(--star-glow);
            object-fit: cover;
        }

        .portal-brand h1 {
            font-size: 1.5rem;
            margin: 0;
            background: linear-gradient(45deg, var(--neon-blue), var(--portal-purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .cosmic-nav {
            display: flex;
            gap: 25px;
            list-style: none;
            margin: 0;
            padding: 0;
            align-items: center;
        }

        .cosmic-nav a {
            color: #9ca3af;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s ease;
            font-size: 0.95rem;
        }

        .cosmic-nav a:hover {
            color: var(--neon-blue);
            text-shadow: 0 0 10px var(--neon-blue);
        }

        .multiverse-container {
            max-width: 1300px;
            margin: 40px auto;
            padding: 0 25px;
        }

        .dimension-section {
            background: rgba(13, 10, 35, 0.6);
            border: 1px solid rgba(121, 40, 202, 0.4);
            border-radius: 16px;
            padding: 25px;
            margin-bottom: 40px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(8px);
        }

        .dimension-title {
            color: var(--neon-blue);
            border-bottom: 2px solid rgba(0, 223, 216, 0.3);
            padding-bottom: 10px;
            margin-bottom: 25px;
            font-size: 1.4rem;
        }

        .galaxy-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
        }

        .quantum-card {
            background: rgba(20, 15, 45, 0.9);
            border: 1px solid rgba(0, 223, 216, 0.3);
            border-radius: 12px;
            padding: 15px;
            width: 240px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .quantum-card img, .quantum-card video {
            width: 100%;
            height: 150px;
            object-fit: cover;
            border-radius: 8px;
            background: #000;
            border: 1px solid rgba(121, 40, 202, 0.3);
        }

        .quantum-card h4 {
            color: white;
            margin: 10px 0 5px;
            font-size: 1rem;
        }

        .quantum-card p {
            color: #9ca3af;
            font-size: 0.85rem;
            margin: 0 0 10px;
        }

        .quantum-stats {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.85rem;
            color: var(--neon-blue);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            padding-top: 8px;
        }

        .quantum-stats span {
            cursor: pointer;
            transition: transform 0.2s;
        }

        .quantum-stats span:hover {
            transform: scale(1.1);
        }

        .cosmic-admin-btn {
            background: linear-gradient(135deg, #ef4444, #b91c1c);
            color: white;
            padding: 8px 16px;
            border-radius: 8px;
            font-weight: bold;
            text-decoration: none;
            box-shadow: 0 0 15px rgba(239, 68, 68, 0.6);
            display: inline-flex;
            align-items: center;
            gap: 6px;
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 99999;
            font-size: 0.9rem;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
    </style>
</head>
<body>

    <header class="cosmic-header">
        <div class="portal-brand">
            <img id="site-logo" src="https://i.imgur.com/8Km9tLL.png" alt="Logo">
            <h1>Gojo Esultan | البعد الموازي</h1>
        </div>
        <ul class="cosmic-nav">
            <li><a href="index.html">البوابة الرئيسية</a></li>
            <li><a href="admin.html">مركز التحكم</a></li>
        </ul>
    </header>

    <div class="multiverse-container" id="cosmic-content-container">
        <!-- يتم جلب المحتوى وعرضه هنا تلقائياً -->
    </div>

    <script src="script.js"></script>
</body>
</html>
