<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gojo Esultan | السلطان جوجو</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="main-header">
        <div class="logo-container">
            <img src="" alt="Gojo Logo" id="site-logo">
            <h1>Gojo Esultan</h1>
        </div>
        
        <nav class="nav-links">
            <a href="index.html">الرئيسية</a>
            <a href="#anime-posts">صور ومنشورات الأنمي</a>
            <a href="#anime-watch">مشاهدة الأنمي</a>
        </nav>

        <div class="auth-buttons" id="auth-section">
            <a href="login.html" class="btn btn-login">تسجيل الدخول</a>
            <a href="login.html?mode=register" class="btn btn-register">إنشاء حساب</a>
        </div>
    </header>

    <main class="container">
        
        <section id="anime-posts" class="content-section">
            <h2>📸 صور ومنشورات الأنمي</h2>
            <div class="grid-container" id="posts-grid"></div>
        </section>

        <section id="anime-watch" class="content-section">
            <h2>🎬 مشاهدة الأنمي</h2>
            <div class="grid-container" id="videos-grid"></div>
        </section>

    </main>

    <footer>
        <p>جميع حقوق الملكية محفوظة &copy; 2026 Gojo Esultan</p>
        <div id="admin-trigger-box" class="admin-trigger-box" style="display:none;">
            <a href="admin.html" class="admin-btn">👑 لوحة تحكم السلطان (خاصة بالمدير)</a>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
